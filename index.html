svg('<rect y="170" width="350" height="60" fill="#d1c9af"/><g stroke="#343d43" fill="none" stroke-width="9"><circle cx="93" cy="164" r="48"/><circle cx="266" cy="164" r="48"/><path d="M93 164l57-85 50 85H93l83-60 90 60-46-85h-70"/><path d="M150 79h45m-26-12h42"/></g><rect x="158" y="106" width="32" height="38" rx="7" fill="#6d8285"/><path d="M219 79h31l21 19" fill="none" stroke="#353c40" stroke-width="9"/>','#dce7d7')];
const offers=[{name:'Fitnessstudio',symbol:'♧'},{name:'Discgolf',symbol:'◎'},{name:'Kletterwand innen',symbol:'⌁'},{name:'Kletterwand außen',symbol:'⌁'},{name:'E-Bike-Verleih',symbol:'♧'}];
const app=document.getElementById('app');let page='home',selected=3,monthOffset=0,day=new Date(),start='15:00',end='16:00';day.setHours(12,0,0,0);
const pad=n=>String(n).padStart(2,'0');const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const dateLabel=d=>d.toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const store='sportcamp_demo_requests_v3';const read=()=>{try{return JSON.parse(localStorage.getItem(store)||'[]')}catch(e){return []}};const write=a=>localStorage.setItem(store,JSON.stringify(a));
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3200)}
function go(p,i){if(i!==undefined)selected=i;page=p;render();window.scrollTo({top:0,behavior:'instant'})}
function photo(i){return `<img class="photo" src="${pics[i]}" alt="${offers[i].name}">`}
function home(){return `<h1 class="title">Unsere Sportangebote</h1><p class="subtitle">Verfügbarkeiten prüfen und <span class="accent"><b>Buchungsanfrage</b></span> stellen.</p><div class="offers">${offers.map((o,i)=>`<button class="offer" onclick="go('booking',${i})">${photo(i)}<span class="offer-copy"><span class="offer-name">${o.symbol} ${o.name}</span><span class="status">Termin anfragen</span></span><span class="chev">›</span></button>`).join('')}</div><div class="notice"><b>ⓘ</b><span><b>Hinweis:</b> Alle Angebote sind kostenpflichtig. Die Preise werden Ihnen vor einer verbindlichen Buchung mitgeteilt.</span></div><p class="demo">Demo-Version: Die Verfügbarkeit ist noch nicht mit einem gemeinsamen Buchungssystem verbunden.</p>`}
function calendarHTML(){let base=new Date(day.getFullYear(),day.getMonth()+monthOffset,1);let first=(base.getDay()+6)%7;let count=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();let today=new Date();today.setHours(0,0,0,0);let cells=Array.from({length:first},()=>'<span></span>').join('');for(let d=1;d<=count;d++){let dt=new Date(base.getFullYear(),base.getMonth(),d);let chosen=iso(dt)===iso(day);cells+=`<button type="button" ${dt<today?'disabled':''} class="${chosen?'chosen':''}" onclick="chooseDay(${base.getFullYear()},${base.getMonth()},${d})">${d}</button>`}return `<div class="calendar"><div class="cal-top"><button type="button" aria-label="Vorheriger Monat" onclick="shiftMonth(-1)">‹</button><strong>${base.toLocaleDateString('de-DE',{month:'long',year:'numeric'})}</strong><button type="button" aria-label="Nächster Monat" onclick="shiftMonth(1)">›</button></div><div class="cal-grid">${['Mo','Di','Mi','Do','Fr','Sa','So'].map(x=>`<span class="weekday">${x}</span>`).join('')}${cells}</div></div>`}
function chooseDay(y,m,d){day=new Date(y,m,d,12);monthOffset=0;render()}function shiftMonth(n){monthOffset+=n;render()}
function timeControls(){const times=[];for(let h=8;h<=21;h++)for(let m of [0,30])times.push(`${pad(h)}:${pad(m)}`);return `<div class="section-title">◷ &nbsp;Uhrzeit</div><div class="time-row"><label>Von<select id="start" onchange="start=this.value">${times.map(t=>`<option ${t===start?'selected':''}>${t}</option>`).join('')}</select></label><label>Bis<select id="end" onchange="end=this.value">${times.map(t=>`<option ${t===end?'selected':''}>${t}</option>`).join('')}</select></label></div>`}
function booking(){return `<button class="back" onclick="go('home')">‹ &nbsp;Zurück</button><div class="detail-head">${photo(selected)}<div><h1>${offers[selected].name}</h1><p>Buchungsanfrage stellen</p></div></div><div class="notice"><b>ⓘ</b><span>Dieses Angebot ist <b>kostenpflichtig.</b> Die Preise werden Ihnen vor einer verbindlichen Buchung mitgeteilt.</span></div><div class="section-title">▣ &nbsp;Wunschtermin</div>${calendarHTML()}<div class="muted" style="margin-top:7px">Ausgewählt: ${dateLabel(day)}</div>${timeControls()}<div class="section-title">♙ &nbsp;Angaben zur Buchung</div><form id="requestForm" onsubmit="submitRequest(event)"><div class="form-grid"><label class="field">Name<input name="name" required autocomplete="name" placeholder="Vor- und Nachname"></label><label class="field">Personen<input name="people" required type="number" min="1" max="100" value="2"></label></div><label class="field">E-Mail<input name="email" type="email" required autocomplete="email" placeholder="name@beispiel.de"></label><label class="field">Anmerkungen (optional)<textarea name="note" placeholder="Besondere Wünsche"></textarea></label><button class="primary" type="submit">➤ &nbsp;Buchungsanfrage senden</button></form><p class="demo">Nur Testbetrieb: Anfragen werden ausschließlich auf diesem Gerät gespeichert und nicht an das Sportcamp versendet.</p>`}
function submitRequest(e){e.preventDefault();if(end<=start){toast('Die Endzeit muss nach der Startzeit liegen.');return}let f=new FormData(e.target);let a=read();let overlapping=a.some(r=>r.offer===selected&&r.date===iso(day)&&r.status!=='abgelehnt'&&start<r.end&&end>r.start);if(overlapping){toast('Dieser Zeitraum ist in dieser Demo bereits angefragt.');return}a.push({id:Date.now(),offer:selected,date:iso(day),start,end,name:String(f.get('name')),email:String(f.get('email')),people:String(f.get('people')),note:String(f.get('note')||''),status:'offen'});write(a);toast('Demo-Anfrage auf diesem Gerät gespeichert');go('requests')}
function requests(){let a=read();return `<h1 class="title">Meine Anfragen</h1><p class="subtitle">Demo-Anfragen auf diesem iPhone.</p>${a.length?a.slice().reverse().map(r=>`<div class="listbox"><strong>${offers[r.offer].name}</strong><div class="muted">${r.date.split('-').reverse().join('.')} · ${r.start}–${r.end} Uhr · ${r.people} Personen</div><div style="margin-top:8px"><span class="pill ${r.status==='bestätigt'?'ok':r.status==='abgelehnt'?'no':''}">${r.status==='offen'?'Wartet auf Freigabe':r.status}</span></div></div>`).join(''):'<div class="empty">Noch keine Buchungsanfragen vorhanden.</div>'}<div class="demo">Keine echte Übermittlung und keine Synchronisierung zwischen Geräten.</div>`}
function availability(){return `<h1 class="title">Verfügbarkeit</h1><p class="subtitle">Wähle ein Angebot und prüfe deinen Wunschtermin.</p>${offers.map((o,i)=>`<button class="offer" onclick="go('booking',${i})">${photo(i)}<span class="offer-copy"><span class="offer-name">${o.name}</span><span class="status">Termin auswählen</span></span><span class="chev">›</span></button>`).join('')}<p class="demo">Echte freie oder belegte Termine können erst mit einer gemeinsamen Datenbank angezeigt werden.</p>`}
function info(){return `<h1 class="title">Informationen</h1><p class="subtitle">Sportcamp Nordbayern – Buchungsanfragen für Sportangebote.</p><div class="notice"><b>ⓘ</b><span>Alle Angebote sind kostenpflichtig. Preise werden vor einer verbindlichen Buchung mitgeteilt. Buchungsanfragen müssen von Mitarbeitenden bestätigt werden.</span></div><h2 style="font-size:17px">Mitarbeiterbereich (Demo)</h2><p class="muted">Die folgende Ansicht dient nur zum Testen. Sie ist nicht passwortgeschützt und darf nicht für echte Kundendaten genutzt werden.</p><button class="secondary" onclick="go('admin')">Demo-Verwaltung öffnen</button>`}
function admin(){let a=read();return `<button class="back" onclick="go('info')">‹ &nbsp;Zurück</button><h1 class="title">Mitarbeiter · Demo</h1><p class="subtitle">Anfragen auf diesem Gerät testweise freigeben oder ablehnen.</p>${a.length?a.slice().reverse().map(r=>`<div class="listbox"><strong>${offers[r.offer].name}</strong><div class="muted">${r.date} · ${r.start}–${r.end}<br>${escapeHTML(r.name)} · ${escapeHTML(r.email)} · ${r.people} Personen</div><p class="tiny">${escapeHTML(r.note)}</p><span class="pill ${r.status==='bestätigt'?'ok':r.status==='abgelehnt'?'no':''}">${r.status}</span><div class="actions"><button class="secondary" onclick="setStatus(${r.id},'bestätigt')">Bestätigen</button><button class="secondary" onclick="setStatus(${r.id},'abgelehnt')">Ablehnen</button></div></div>`).join(''):'<div class="empty">Noch keine Anfragen.</div>'}<p class="demo">Keine echte Anmeldung. Für einen produktiven Betrieb ist eine sichere Datenbank und Mitarbeiter-Authentifizierung erforderlich.</p>`}
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setStatus(id,status){let a=read();let r=a.find(x=>x.id===id);if(r){r.status=status;write(a);render()}}
function render(){app.innerHTML=({home,calendar:availability,booking,requests,info,admin})[page]();document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===(page==='admin'?'info':page)))}render();
</script></body></html>
