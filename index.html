const offers=[{id:'fitness',name:'Fitnessstudio',icon:'🏋️'},{id:'disc',name:'Discgolf',icon:'🥏'},{id:'indoor',name:'Kletterwand innen',icon:'🧗'},{id:'outdoor',name:'Kletterwand außen',icon:'🧗',img:OUTDOOR},{id:'bike',name:'E-Bike-Verleih',icon:'🚲'}];
const STORE='sportcamp-nordbayern-test-v3';let data;try{data=JSON.parse(localStorage.getItem(STORE))||{requests:[],blocks:[]}}catch(e){data={requests:[],blocks:[]}};
let page='home',selected='fitness',date=new Date().toLocaleDateString('en-CA'),from='10:00',to='11:00',count=1,adminTab='requests',feedback='';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(STORE,JSON.stringify(data));
const offer=id=>offers.find(o=>o.id===id)||offers[0];
const fmt=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'});
const times=Array.from({length:15},(_,i)=>String(i+7).padStart(2,'0')+':00');
const slots=times.slice(0,-1).map((t,i)=>({from:t,to:times[i+1]}));
function conflicts(a,b){return a.from<b.to&&a.to>b.from}
function occupied(id,d,a,b){return [...data.blocks,...data.requests.filter(x=>x.status!=='rejected')].some(x=>x.offer===id&&x.date===d&&conflicts(x,{from:a,to:b}))}
function setPage(p,id){page=p;if(id)selected=id;feedback='';render();window.scrollTo(0,0)}
function selectDate(v){date=v;render()}
function selectOffer(v){selected=v;render()}
function render(){const app=$('app');$('headerMode').innerHTML=page==='admin'?'🔒 Mitarbeiterbereich':'Öffentlicher<br>Gästebereich';$('nav').innerHTML=[['home','⌂','Start'],['availability','▦','Kalender'],['mine','☷','Anfragen'],['admin','⚙','Mitarbeiter']].map(([p,i,n])=>`<button class="${page===p||page==='booking'&&p==='home'?'active':''}" onclick="setPage('${p}')"><div style="font-size:22px">${i}</div>${n}</button>`).join('');
if(page==='home'){app.innerHTML=`<h1>Unsere Sportangebote</h1><p class="muted">Verfügbarkeiten prüfen und Buchungsanfragen stellen.</p>${offers.map(o=>`<button class="offer" onclick="setPage('booking','${o.id}')">${o.img?`<img src="${o.img}" alt="Kletterwand außen">`:`<div class="placeholder">${o.icon}</div>`}<span class="grow"><strong>${o.name}</strong><br><span class="status">Zeiten ansehen</span></span><span style="font-size:26px">›</span></button>`).join('')}<div class="notice">ℹ️ Alle Angebote sind kostenpflichtig. Die Preise werden vor einer verbindlichen Buchung mitgeteilt.</div>`}
if(page==='booking'){let o=offer(selected);app.innerHTML=`<button class="back" onclick="setPage('home')">‹ Zurück zu den Angeboten</button><div class="card">${o.img?`<img class="thumb" src="${o.img}" alt="Originalfoto Kletterwand außen">`:''}<h1>${o.icon} ${o.name}</h1><p class="muted">Buchungsanfrage stellen</p><div class="notice">Dieses Angebot ist <b>kostenpflichtig</b>. Der Preis wird vor einer verbindlichen Buchung mitgeteilt.</div><label>Wunschtermin</label><input type="date" id="bookDate" value="${date}" min="${new Date().toLocaleDateString('en-CA')}" onchange="selectDate(this.value)"><label>Verfügbare Zeiten</label><div id="slots">${slots.map(s=>{let busy=occupied(selected,date,s.from,s.to);return `<div class="slot ${busy?'busy':''}"><span><b>${s.from}–${s.to}</b> <span class="small">${busy?'Belegt / angefragt':'Frei'}</span></span>${busy?'':`<button onclick="chooseSlot('${s.from}','${s.to}')">Wählen</button>`}</div>`}).join('')}</div><div id="bookingForm" class="hidden"><h2>Anfrage für <span id="chosenTime"></span></h2><label>Dein Name *</label><input id="guestName" autocomplete="name" placeholder="Vor- und Nachname"><label>E-Mail-Adresse *</label><input id="guestEmail" type="email" autocomplete="email" placeholder="name@beispiel.de"><label>${selected==='bike'?'Anzahl E-Bikes':'Personenzahl'}</label><div class="counter"><button onclick="adjust(-1)">−</button><span id="counter">${count}</span><button onclick="adjust(1)">+</button></div><label>Bemerkung (optional)</label><textarea id="guestNote" placeholder="z. B. Verein oder Trainingsgruppe"></textarea><p class="error" id="formError"></p><button class="primary" onclick="submitRequest()">Buchungsanfrage senden</button></div></div>`;if(feedback)app.insertAdjacentHTML('afterbegin',`<div class="success">${esc(feedback)}</div>`)}
if(page==='availability'){app.innerHTML=`<h1>Belegungsplan</h1><p class="muted">Wähle Angebot und Datum. Grün = frei, Rot = belegt oder angefragt.</p><label>Sportangebot</label><select onchange="selectOffer(this.value)">${offers.map(o=>`<option value="${o.id}" ${selected===o.id?'selected':''}>${o.name}</option>`).join('')}</select><label>Datum</label><input type="date" value="${date}" onchange="selectDate(this.value)"><div class="card"><h2>${offer(selected).name} · ${fmt(date)}</h2>${slots.map(s=>{let busy=occupied(selected,date,s.from,s.to);return `<div class="slot ${busy?'busy':''}"><span>${s.from}–${s.to} · <b>${busy?'Belegt / angefragt':'Frei'}</b></span>${busy?'':`<button onclick="setPage('booking','${selected}');chooseSlot('${s.from}','${s.to}')">Anfragen</button>`}</div>`}).join('')}</div>`}
if(page==='mine'){app.innerHTML=`<h1>Test-Buchungsanfragen</h1><p class="muted">Anfragen werden nur auf diesem Gerät gespeichert. Es werden keine E-Mails versendet.</p>${data.requests.length?data.requests.slice().reverse().map(r=>requestCard(r,false)).join(''):'<div class="empty">Noch keine Buchungsanfragen vorhanden.</div>'}`}
if(page==='admin'){app.innerHTML=`<h1>Mitarbeiterbereich <span class="pill">TESTMODUS</span></h1><div class="notice">🔒 Dies ist eine Demo ohne echten Login. Vor einer öffentlichen Nutzung wird der Mitarbeiterbereich geschützt.</div><div class="adminbar"><button class="secondary ${adminTab==='requests'?'selected':''}" onclick="adminTab='requests';render()">Anfragen (${data.requests.filter(x=>x.status==='pending').length})</button><button class="secondary ${adminTab==='blocks'?'selected':''}" onclick="adminTab='blocks';render()">Termine</button></div>${adminTab==='requests'?`<h2>Buchungsanfragen</h2>${data.requests.length?data.requests.slice().reverse().map(r=>requestCard(r,true)).join(''):'<div class="empty">Noch keine Anfragen vorhanden.</div>'}`:`<div class="card"><h2>Belegung eintragen</h2><label>Angebot</label><select id="blockOffer">${offers.map(o=>`<option value="${o.id}">${o.name}</option>`).join('')}</select><label>Datum</label><input type="date" id="blockDate" value="${date}"><div class="row"><div class="grow"><label>Von</label><select id="blockFrom">${times.slice(0,-1).map(t=>`<option>${t}</option>`).join('')}</select></div><div class="grow"><label>Bis</label><select id="blockTo">${times.slice(1).map(t=>`<option>${t}</option>`).join('')}</select></div></div><label>Gruppe / Bezeichnung</label><input id="blockTitle" placeholder="z. B. Vereinstraining"><p class="error" id="blockError"></p><button class="primary" onclick="addBlock()">Termin speichern</button></div><h2>Gespeicherte Termine</h2>${data.blocks.length?data.blocks.slice().reverse().map(b=>`<div class="card"><b>${offer(b.offer).name}</b><p>${fmt(b.date)} · ${b.from}–${b.to}<br>${esc(b.title)}</p><button class="secondary danger" onclick="removeBlock('${b.id}')">Löschen</button></div>`).join(''):'<div class="empty">Noch keine Termine eingetragen.</div>'}`}`}
}
function requestCard(r,admin){return `<div class="card"><b>${offer(r.offer).icon} ${offer(r.offer).name}</b><p>${fmt(r.date)} · ${r.from}–${r.to}<br>${esc(r.name)} · ${r.count} ${r.offer==='bike'?'E-Bikes':'Person(en)'}<br><span class="small muted">${esc(r.email)}</span>${r.note?`<br>${esc(r.note)}`:''}</p><span class="status ${r.status==='pending'?'pending':r.status==='rejected'?'busy':''}">${r.status==='pending'?'⏳ Angefragt':r.status==='approved'?'✓ Bestätigt':'✕ Abgelehnt'}</span>${admin&&r.status==='pending'?`<div class="actions" style="margin-top:12px"><button class="secondary" onclick="updateRequest('${r.id}','approved')">✓ Bestätigen</button><button class="secondary danger" onclick="updateRequest('${r.id}','rejected')">Ablehnen</button></div>`:''}</div>`}
function chooseSlot(a,b){from=a;to=b;count=1;const f=$('bookingForm');if(f){f.classList.remove('hidden');$('chosenTime').textContent=a+'–'+b;$('counter').textContent=count;f.scrollIntoView({behavior:'smooth',block:'start'})}}
function adjust(n){count=Math.max(1,Math.min(50,count+n));$('counter').textContent=count}
function submitRequest(){let name=$('guestName').value.trim(),email=$('guestEmail').value.trim();if(!name||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){$('formError').textContent='Bitte Namen und gültige E-Mail-Adresse eingeben.';return}if(occupied(selected,date,from,to)){$('formError').textContent='Dieser Zeitraum ist inzwischen belegt.';return}data.requests.push({id:String(Date.now()),offer:selected,date,from,to,count,name,email,note:$('guestNote').value.trim(),status:'pending'});save();feedback='Testanfrage gespeichert. Sie kann im Mitarbeiterbereich bestätigt werden. Es wurde keine E-Mail versendet.';setPage('mine')}
function updateRequest(id,status){let r=data.requests.find(x=>x.id===id);if(r){r.status=status;save();render()}}
function addBlock(){let o=$('blockOffer').value,d=$('blockDate').value,a=$('blockFrom').value,b=$('blockTo').value,title=$('blockTitle').value.trim();if(!d||a>=b||!title){$('blockError').textContent='Bitte Datum, gültige Uhrzeiten und Bezeichnung angeben.';return}if(occupied(o,d,a,b)){$('blockError').textContent='Zeitraum ist bereits belegt oder angefragt.';return}data.blocks.push({id:String(Date.now()),offer:o,date:d,from:a,to:b,title});save();render()}
function removeBlock(id){data.blocks=data.blocks.filter(x=>x.id!==id);save();render()}
render();
</script></body></html>
